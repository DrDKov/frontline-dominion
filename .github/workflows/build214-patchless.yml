name: Build 214 patchless feature gate

on:
  push:
    branches: [build214-patchless-features]
  pull_request:
    branches: [main, stage1c-patchless-pipeline]
    paths:
      - '.github/workflows/build214-patchless.yml'
      - 'package.json'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/legacy-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build214-patchless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FD_EXPECTED_BUILD: '214'
      FD_BASE_URL: http://127.0.0.1:8765/frontline-dominion
      FD_GAME_URL: http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=214
      FD_MULTIPLAYER_URL: http://127.0.0.1:8765/frontline-dominion/multiplayer.html?build=214
      FD205_SOAK_MS: '90000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static source checks
        run: |
          set -euo pipefail
          node --check tools/build.mjs
          node --check tools/checkdeps.mjs
          node --check tools/stage1-check.mjs
          node --check src/legacy/logistics-service-replan.js
          node --check src/legacy/ai-economy-logistics.js
          node --check src/legacy/ai-logistics-strategy.js
          node --check src/legacy/transport-fire.js
          node --check src/legacy/engineer-command-control.js
          node --check tests/command-bridge.mjs
          node --check tests/logistics-service-replan.mjs
          node --check tests/transport-fire.mjs
          node --check tests/ai-economy-logistics.mjs
          node --check tests/ai-logistics-strategy.mjs
          node --check tests/engineer-command-control.mjs

      - name: Patchless build and dependency graph
        run: npm run check:stage1

      - name: Verify generated feature ownership
        run: |
          set -euo pipefail
          grep -q 'FD_MANIFEST_PAGE_MODULES' dist/frontline-dominion.html
          grep -q 'transport-fire.js?build=214' dist/frontline-dominion.html
          grep -q 'ai-economy-logistics.js?build=214' dist/frontline-dominion.html
          grep -q 'ai-logistics-strategy.js?build=214' dist/frontline-dominion.html
          grep -q 'engineer-command-control.js?build=214' dist/frontline-dominion.html
          grep -q 'logistics-service-replan.js?build=214' dist/frontline-dominion.html
          grep -q 'FD_MANIFEST_WORKER_MODULES' dist/authoritative-simulation-worker-v174.js
          grep -q 'transport-fire.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'ai-logistics-strategy.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'engineer-command-control.js?build=214' dist/authoritative-simulation-worker-v174.js
          node -e "const m=require('./dist/build-meta.json'); if(m.build!==214||m.version!=='16.9.8'||m.cacheBustMode!=='inject'||m.pageModules.length!==5||m.workerModules.length!==5) process.exit(1)"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve patchless build 214
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd214-http.log 2>&1 &
          echo $! >/tmp/fd214-http.pid
          for attempt in $(seq 1 100); do
            if curl -fsSL "$FD_GAME_URL" >/tmp/fd214-game.html && curl -fsSL "$FD_MULTIPLAYER_URL" >/tmp/fd214-multiplayer.html; then exit 0; fi
            sleep .1
          done
          exit 1

      - name: Inherited physical runtime gates
        run: |
          set -euo pipefail
          node tests/runtime-capabilities.mjs 2>&1 | tee /tmp/fd214-01-capabilities.log
          node tests/logistics206-invariants.mjs 2>&1 | tee /tmp/fd214-02-logistics-invariants.log
          node tests/logistics-service.mjs 2>&1 | tee /tmp/fd214-03-logistics-service.log
          node tests/logistics-missions.mjs 2>&1 | tee /tmp/fd214-04-logistics-missions.log
          node tests/aviation207-worker.mjs 2>&1 | tee /tmp/fd214-05-aviation.log
          node tests/command-bridge.mjs 2>&1 | tee /tmp/fd214-06-command-bridge.log
          node tests/extractor-haul.mjs 2>&1 | tee /tmp/fd214-07-extractor-haul.log
          node tests/save-load-current.mjs 2>&1 | tee /tmp/fd214-08-save-load-current.log

      - name: Logistics combat engineer and strategy gates
        run: |
          set -euo pipefail
          node tests/logistics-service-replan.mjs 2>&1 | tee /tmp/fd214-09-service-replan.log
          node tests/transport-fire.mjs 2>&1 | tee /tmp/fd214-10-transport-fire.log
          node tests/ai-economy-logistics.mjs 2>&1 | tee /tmp/fd214-11-ai-economy.log
          node tests/engineer-command-control.mjs 2>&1 | tee /tmp/fd214-12-engineer-control.log
          node tests/ai-logistics-strategy.mjs 2>&1 | tee /tmp/fd214-13-ai-strategy.log

      - name: Multiplayer deterministic hash probe
        run: |
          set -euo pipefail
          node tests/multiplayer-probe.mjs 2>&1 | tee /tmp/fd214-14-multiplayer.log
          grep -Eq '"hashAdvance":[[:space:]]*(3[0-9]|[4-9][0-9]|[1-9][0-9]{2,})' /tmp/fd214-14-multiplayer.log
          ! grep -Eq '"hashMismatches":[[:space:]]*[1-9]' /tmp/fd214-14-multiplayer.log
          ! grep -Eq '"resyncsRequested":[[:space:]]*[1-9]' /tmp/fd214-14-multiplayer.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build214-patchless-diagnostics
          path: |
            .stage1-deps.json
            .stage1-unversioned.json
            /tmp/fd214-*.log
            /tmp/fd214-*.html
          if-no-files-found: ignore
          retention-days: 7
