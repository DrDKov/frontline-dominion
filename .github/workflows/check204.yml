name: Validate Frontline Dominion build 204

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontline-check-204-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  input-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble build 204
        run: |
          set -euo pipefail
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py

      - name: Static and unit gates
        run: |
          set -euo pipefail
          grep -q 'data-fd-canonical-build="204"' dist/frontline-dominion.html
          grep -q 'building-visible-hit-v204.js?build=204' dist/frontline-dominion.html
          grep -q 'rally-point-authority-v204.js?build=204' dist/frontline-dominion.html
          grep -q '__FD_BUILDING_VISIBLE_HIT_204__' dist/building-visible-hit-v204.js
          grep -q '__FD_RALLY_POINT_AUTHORITY_204__' dist/rally-point-authority-v204.js
          python -m py_compile scripts/assemble204.py scripts/generate204_tests.py
          node --check dist/building-visible-hit-v204.js
          node --check dist/rally-point-authority-v204.js
          node --check tests/input-authority204.mjs
          node tests/building-visible-hit204.unit.mjs
          node tests/rally-point204.unit.mjs
          node tests/recon-memory-queue203.unit.mjs

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium

      - name: Physical left/right click gate
        run: |
          set -euo pipefail
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd204-check-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          FD_GAME_URL='http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=204' node tests/input-authority204.mjs
