name: Validate Frontline Dominion build 208 single-player

on:
  push:
    branches: [build208-logistics-controls-construction]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontline-check-208-singleplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  singleplayer208:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble build 208
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py
          python scripts/assemble205.py
          python scripts/assemble206.py
          python scripts/hotfix206_logistics_state.py
          python scripts/hotfix206_truck_commands.py
          python scripts/hotfix206_multiplayer_hash.py
          python scripts/hotfix206_deterministic_geometry.py
          python scripts/hotfix206_multiplayer_initial_state.py
          python scripts/hotfix206_resync_snapshot.py
          python scripts/hotfix206_resync_continuity.py
          python scripts/hotfix206_network_components.py
          python scripts/hotfix206_initial_signature.py
          python scripts/hotfix206_ai_trace_diagnostics.py
          python scripts/install206_ui.py
          python scripts/patch206_invariant_harness.py
          python scripts/assemble207.py
          python scripts/assemble208.py
          python scripts/hotfix208_logistics_replication.py
          python scripts/hotfix208_transport_ack_diagnostic.py
          python scripts/hotfix208_completed_trace_diagnostic.py

      - name: Static build 208 gates
        run: |
          set -euo pipefail
          test -s dist/frontline-dominion.html
          test -s dist/gameplay-v208.js
          test -s dist/logistics-ui-v208.js
          test -s dist/runtime-ui-v208.js
          test -s dist/runtime-shell-v208.js
          test -s dist/save-slots-v208.js
          grep -q 'data-fd-canonical-build="208"' dist/frontline-dominion.html
          grep -q 'gameplay-v208.js?build=208' dist/frontline-dominion.html
          grep -q 'logistics-ui-v208.js?build=208' dist/frontline-dominion.html
          ! grep -q 'logistics-ui-v207.js?build=208' dist/frontline-dominion.html
          grep -q 'runtime-ui-v208.js?build=208' dist/frontline-dominion.html
          grep -q 'runtime-shell-v208.js?build=208' dist/frontline-dominion.html
          grep -q 'save-slots-v208.js?build=208' dist/frontline-dominion.html
          grep -q 'fd-boot-bridge208' dist/frontline-dominion.html
          grep -q "importScripts('/frontline-dominion/gameplay-v208.js?build=208')" dist/authoritative-simulation-worker-v174.js
          grep -q 'completedTrace208' dist/authoritative-simulation-worker-v174.js
          grep -q 'logisticsCritical208' dist/authoritative-simulation-worker-v174.js
          grep -q '_fdLogisticsDetailUntil208' dist/supply-transport-v206.js
          grep -q "productionMaterialPackage206?.(source,'resourceTruck')" dist/supply-transport-v206.js
          grep -q 'logisticsCreateTransport' dist/authoritative-simulation-worker-v174.js
          grep -q 'workerAutomation207' dist/singleplayer-gameplay-v207.js
          grep -q 'pruneIdleEngineerHauling208' dist/gameplay-v208.js
          grep -q 'moneyIncomePerSecond208' dist/gameplay-v208.js
          grep -q 'targetUnitIds208' dist/logistics-ui-v208.js
          grep -q 'СОЗДАТЬ ТРАНСПОРТ' dist/logistics-ui-v208.js
          python -m py_compile scripts/assemble208.py scripts/hotfix208_logistics_replication.py scripts/hotfix208_transport_ack_diagnostic.py scripts/hotfix208_completed_trace_diagnostic.py scripts/generate208_tests.py
          for file in dist/*.js; do node --check "$file"; done
          node --check tests/logistics208-controls-v2.mjs
          count=$(find dist/models -type f | wc -l)
          test "$count" -gt 700

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium

      - name: Focused authoritative transport diagnostic
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/logistics208-controls-v2.mjs')
          text=p.read_text('utf-8')
          old="const n=L.ensureNode(b);return{__pending:true,queue:"
          new="const n=L.ensureNode(b),bridge=globalThis.__FD_STABLE_STATE165__?.bridge,now=Number(g.time)||0;if(!globalThis.__FD208_TIED_START__)globalThis.__FD208_TIED_START__=now;if(now-globalThis.__FD208_TIED_START__>2&&!globalThis.__FD208_TIED_SAVE__)globalThis.__FD208_TIED_SAVE__=bridge?.requestSave?.(false)||0;let authoritative=null;const saveId=Number(globalThis.__FD208_TIED_SAVE__||0);if(saveId&&bridge&&!bridge.pendingSaves?.has?.(saveId)){try{const raw=globalThis.__FD_DEBUG__.storageGet(globalThis.__FD_DEBUG__.SAVE_KEY),data=raw?JSON.parse(raw):null;const find=(value,depth=0)=>{if(!value||depth>10)return null;if(Array.isArray(value)){for(const item of value){const hit=find(item,depth+1);if(hit)return hit;}return null;}if(typeof value==='object'){if(String(value.id||'')===String(I.barracks)&&String(value.typeId||'')==='barracks')return value;for(const item of Object.values(value)){const hit=find(item,depth+1);if(hit)return hit;}}return null;};const hit=find(data);authoritative=hit?{completed:Boolean(hit.completed),construction:Number(hit.construction),queue:(hit.queue||[]).map(q=>({id:q.id,kind:q.kind,remaining:Number(q.remaining),total:Number(q.total)})),stock:hit.logistics206?.stock||null,blocked:Boolean(hit.logistics206?.productionBlocked206),demand:hit.logistics206?.productionDemand206||null,saveTick:Number(data?.authoritative172?.simTick||data?.simTick||0)}:{notFound:true,keys:Object.keys(data||{})};}catch(error){authoritative={error:String(error?.stack||error)};}}return{__pending:true,authoritative,completedTrace:bridge?.completedTrace208||[],queue:"
          if text.count(old)!=1: raise SystemExit(f'authoritative diagnostic anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          old="fuelMax:Number(n?.stock?.fuelMax||0),blocked:Boolean(n?.productionBlocked206||b?.logistics206?.productionBlocked206),credits:"
          new="fuelMax:Number(n?.stock?.fuelMax||0),ammo:Number(n?.stock?.ammo||0),ammoMax:Number(n?.stock?.ammoMax||0),support:Number(n?.stock?.support||0),supportMax:Number(n?.stock?.supportMax||0),completed:Boolean(b?.completed),construction:Number(b?.construction),demand:{...(b?.logistics206?.productionDemand206||{})},ack:bridge?.lastActionAck208||null,blocked:Boolean(n?.productionBlocked206||b?.logistics206?.productionBlocked206),credits:"
          if text.count(old)!=1: raise SystemExit(f'diagnostic stock anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          old_timeout="},{I,before},45000);if(tied.home!==I.barracks"
          new_timeout="},{I,before},9000);if(tied.home!==I.barracks"
          if text.count(old_timeout)!=1: raise SystemExit(f'diagnostic timeout anchor count={text.count(old_timeout)}')
          text=text.replace(old_timeout,new_timeout,1)
          p.write_text(text,'utf-8')
          PY
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd208-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          BASE_URL='http://127.0.0.1:8765/frontline-dominion'
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsSL "$BASE_URL/frontline-dominion.html?build=208" >/tmp/fd208-local.html; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          GAME_URL="$BASE_URL/frontline-dominion.html?build=208"
          FD_GAME_URL="$GAME_URL" node tests/logistics208-controls-v2.mjs 2>&1 | tee /tmp/fd208-logistics.log

      - name: Upload build 208 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd208-singleplayer-diagnostics
          path: |
            /tmp/fd208-http.log
            /tmp/fd208-logistics.log
          if-no-files-found: ignore
          retention-days: 3
