name: Validate Frontline Dominion movement hotfix

on:
  push:
    branches: [hotfix209-movement-target-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble current build 208
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py
          python scripts/assemble205.py
          python scripts/assemble206.py
          python scripts/hotfix206_logistics_state.py
          python scripts/hotfix206_truck_commands.py
          python scripts/hotfix206_multiplayer_hash.py
          python scripts/hotfix206_deterministic_geometry.py
          python scripts/hotfix206_multiplayer_initial_state.py
          python scripts/hotfix206_resync_snapshot.py
          python scripts/hotfix206_resync_continuity.py
          python scripts/hotfix206_network_components.py
          python scripts/hotfix206_initial_signature.py
          python scripts/hotfix206_ai_trace_diagnostics.py
          python scripts/install206_ui.py
          python scripts/patch206_invariant_harness.py
          python scripts/assemble207.py
          python scripts/assemble208.py
          python scripts/hotfix208_logistics_replication.py
      - name: Install Chromium and generate movement gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          python - <<'PY'
          from pathlib import Path
          text=Path('tests/movement198.mjs').read_text('utf-8').replace('198','208')
          Path('tests/movement208.generated.mjs').write_text(text,'utf-8')
          hidpi=text.replace('deviceScaleFactor: 1', 'deviceScaleFactor: 2')
          Path('tests/movement208-hidpi.generated.mjs').write_text(hidpi,'utf-8')
          directional=Path('tests/movement209-directional.mjs').read_text('utf-8')
          free="if (typeof game.setFormationEnabled201 === 'function') game.setFormationEnabled201(false, false);\n  if (game.formationSettings) game.formationSettings.enabled = false;"
          line="game.setFormationMode?.('line');\n  if (typeof game.setFormationEnabled201 === 'function') game.setFormationEnabled201(true, false);\n  if (game.formationSettings) { game.formationSettings.enabled = true; game.formationSettings.mode = 'line'; }"
          if directional.count(free) != 2:
              raise SystemExit(f'unexpected free-formation anchors: {directional.count(free)}')
          Path('tests/movement209-line.generated.mjs').write_text(directional.replace(free,line),'utf-8')
          PY
          node --check tests/movement208.generated.mjs
          node --check tests/movement208-hidpi.generated.mjs
          node --check tests/movement209-directional.mjs
          node --check tests/movement209-line.generated.mjs
      - name: Physical right-click movement gates
        run: |
          set -euo pipefail
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd209-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          GAME_URL='http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=208'
          FD_GAME_URL="$GAME_URL" node tests/movement208.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/movement208-hidpi.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/movement209-directional.mjs
          FD_GAME_URL="$GAME_URL" node tests/movement209-line.generated.mjs
