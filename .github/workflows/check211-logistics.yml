name: Check Frontline Dominion build 211 logistics integrity

on:
  push:
    branches: [build211-logistics-integrity]
    paths:
      - '.github/workflows/check211-logistics.yml'
      - 'scripts/assemble211.py'
      - 'scripts/hotfix211_manual_source.py'
      - 'tests/logistics211-service.mjs'
      - 'tests/logistics211-missions.mjs'
  workflow_dispatch:

jobs:
  check211:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble build 211
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py
          python scripts/assemble205.py
          python scripts/assemble206.py
          python scripts/hotfix206_logistics_state.py
          python scripts/hotfix206_truck_commands.py
          python scripts/hotfix206_multiplayer_hash.py
          python scripts/hotfix206_deterministic_geometry.py
          python scripts/hotfix206_multiplayer_initial_state.py
          python scripts/hotfix206_resync_snapshot.py
          python scripts/hotfix206_resync_continuity.py
          python scripts/hotfix206_network_components.py
          python scripts/hotfix206_initial_signature.py
          python scripts/hotfix206_ai_trace_diagnostics.py
          python scripts/install206_ui.py
          python scripts/patch206_invariant_harness.py
          python scripts/assemble207.py
          python scripts/assemble208.py
          python scripts/hotfix208_logistics_replication.py
          python scripts/assemble209.py
          python scripts/assemble210.py
          python scripts/assemble211.py
          python scripts/hotfix211_manual_source.py

      - name: Static integrity gates
        run: |
          set -euo pipefail
          test -s dist/frontline-dominion.html
          test -s dist/supply-transport-v206.js
          test -s dist/runtime-ui-v211.js
          test -s dist/runtime-shell-v211.js
          test -s dist/save-slots-v211.js
          grep -q 'data-fd-canonical-build="211"' dist/frontline-dominion.html
          grep -q 'runtime-ui-v211.js?build=211' dist/frontline-dominion.html
          grep -q 'runtime-shell-v211.js?build=211' dist/frontline-dominion.html
          grep -q 'save-slots-v211.js?build=211' dist/frontline-dominion.html
          grep -q '__FD_LOGISTICS_INTEGRITY_211__' dist/supply-transport-v206.js
          grep -q 'truckToTruckTankService: true' dist/supply-transport-v206.js
          grep -q 'missionRadiusAuthoritative: true' dist/supply-transport-v206.js
          grep -q 'manualSourceAuthoritative: true' dist/supply-transport-v206.js
          grep -q "s.missionType==='AUTO'" dist/supply-transport-v206.js
          ! grep -q "s.destinationNodeId=s.homeNodeId;s.missionType='SUPPLY_BUILDING'" dist/supply-transport-v206.js
          grep -q 'effectiveRadius211' dist/supply-transport-v206.js
          grep -q 'L.isAir(unit)' dist/supply-transport-v206.js
          python -m py_compile scripts/assemble211.py scripts/hotfix211_manual_source.py
          node --check tests/logistics211-service.mjs
          node --check tests/logistics211-missions.mjs
          for file in dist/*.js; do node --check "$file"; done
          count=$(find dist/models -type f | wc -l)
          test "$count" -gt 700

      - name: Install Chromium and generate inherited gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          python scripts/generate210_tests.py
          node --check tests/save-slots210.generated.mjs
          node --check tests/free-group-direction210.generated.mjs

      - name: Physical logistics integrity gates
        run: |
          set -euo pipefail
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd211-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          BASE_URL='http://127.0.0.1:8765/frontline-dominion'
          GAME_URL="$BASE_URL/frontline-dominion.html?build=211"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsSL "$GAME_URL" >/tmp/fd211-local.html; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          grep -q 'data-fd-canonical-build="211"' /tmp/fd211-local.html
          FD_BASE_URL="$BASE_URL" node tests/logistics206-invariants.mjs 2>&1 | tee /tmp/fd211-invariants.log
          FD_GAME_URL="$GAME_URL" node tests/worker207-bootstrap.mjs 2>&1 | tee /tmp/fd211-bootstrap.log
          FD_GAME_URL="$GAME_URL" node tests/logistics-ui210.mjs 2>&1 | tee /tmp/fd211-ui.log
          FD_GAME_URL="$GAME_URL" node tests/logistics211-service.mjs 2>&1 | tee /tmp/fd211-service.log
          FD_GAME_URL="$GAME_URL" node tests/logistics211-missions.mjs 2>&1 | tee /tmp/fd211-missions.log
          FD_GAME_URL="$GAME_URL" node tests/logistics208-controls-v2.mjs 2>&1 | tee /tmp/fd211-inherited-logistics.log
          FD_GAME_URL="$GAME_URL" node tests/construction208-all-buildings-v2.mjs 2>&1 | tee /tmp/fd211-construction.log
          FD_GAME_URL="$GAME_URL" node tests/screen-direction210.mjs 2>&1 | tee /tmp/fd211-screen.log
          FD_GAME_URL="$GAME_URL" node tests/free-group-direction210.generated.mjs 2>&1 | tee /tmp/fd211-group-direction.log
          FD_GAME_URL="$GAME_URL" node tests/save-slots210.generated.mjs 2>&1 | tee /tmp/fd211-save.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd211-logistics-integrity-diagnostics
          path: |
            /tmp/fd211-*.log
            /tmp/fd211-local.html
          if-no-files-found: ignore
          retention-days: 3
