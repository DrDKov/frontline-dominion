name: Deploy Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontline-pages
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble build 177
        run: |
          rm -rf dist
          python scripts/assemble177.py

      - name: Guarantee build 176/177 browser modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/frontline-dominion.html')
          s=p.read_text('utf-8')
          tags=[]
          if 'fire-discipline-v177.js?build=177' not in s:
              tags.append('<script src="./fire-discipline-v177.js?build=177"></script>')
          if 'minimap-stability-v176.js?build=176' not in s:
              tags.append('<script src="./minimap-stability-v176.js?build=176"></script>')
          if tags:
              payload='\n'+'\n'.join(tags)+'\n'
              s=s.replace('</body>',payload+'</body>',1) if '</body>' in s else s+payload
              p.write_text(s,'utf-8')
          PY

      - name: Validate assembled game
        run: |
          set -euo pipefail
          for f in index.html frontline-dominion.html fire-discipline-v177.js minimap-stability-v176.js authoritative-simulation-v174.js authoritative-simulation-worker-v174.js multiplayer-game-v96.js models/pilot/manifest.json; do
            test -s "dist/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q 'fire-discipline-v177.js?build=177' dist/frontline-dominion.html
          grep -q 'minimap-stability-v176.js?build=176' dist/frontline-dominion.html
          echo 'worker fire discipline:'
          grep -n 'fireDiscipline177' dist/authoritative-simulation-worker-v174.js | head || true
          echo 'multiplayer fire discipline:'
          grep -n 'fireDiscipline177' dist/multiplayer-game-v96.js | head || true
          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
