name: Build Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble and regression-test v16.8 core
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          node --check dist/action-group-core-v184.js
          node --check dist/construction-victory-v184.js
          node tests/verify181.js
          node tests/verify182.generated.js dist/deep-operations-ai-v182.js
          node tests/verify183.generated.js dist
          node tests/verify184.js dist

      - name: Apply v16.8.1 runtime isolation
        run: |
          set -euo pipefail
          python scripts/assemble185.py
          test -s dist/authoritative-simulation-v174.js
          test -s dist/authoritative-simulation-worker-v174.js
          test "$(grep -o 'authoritative-simulation-v174.js?build=185' dist/frontline-dominion.html | wc -l)" -eq 1

      - name: Apply v16.8.2 command recovery
        run: |
          set -euo pipefail
          python scripts/assemble186.py
          for f in index.html frontline-dominion.html runtime-ui-v186.js action-group-core-v184.js construction-victory-v184.js formation-march-core-v183.js fortress-defense-ai-v183.js deep-operations-ai-v182.js minimap-atomic-v181.js minefield-defense-catalog-v181.js combat-scale-core-v166.js simulation-profiler-v166.js authoritative-simulation-v174.js authoritative-simulation-worker-v174.js models/pilot/manifest.json; do
            test -s "dist/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q 'frontline-dominion.html?build=186' dist/index.html
          ! grep -Eq 'frontline-dominion.html\?build=18[0-5]' dist/index.html
          test "$(grep -o 'authoritative-simulation-v174.js?build=186' dist/frontline-dominion.html | wc -l)" -eq 1
          test "$(grep -o 'runtime-ui-v186.js?build=186' dist/frontline-dominion.html | wc -l)" -eq 1
          ! grep -q 'runtime-ui-v185.js' dist/frontline-dominion.html
          grep -q 'simulation-profiler-v166.js?build=186' dist/frontline-dominion.html
          ! grep -q '<script src="./action-group-core-v184.js' dist/frontline-dominion.html
          ! grep -q '<script src="./construction-victory-v184.js' dist/frontline-dominion.html
          grep -q "const BUILD = 186" dist/authoritative-simulation-v174.js
          grep -q "const VERSION = '16.8.2'" dist/authoritative-simulation-v174.js
          grep -q 'resumeIfMainRunning' dist/authoritative-simulation-v174.js
          grep -q "type: 'pause', paused: Boolean(this.game?.paused)" dist/authoritative-simulation-v174.js
          grep -q "const BUILD = 186" dist/authoritative-simulation-worker-v174.js
          grep -q "const VERSION = '16.8.2'" dist/authoritative-simulation-worker-v174.js
          grep -q 'paused = Boolean(message.paused);' dist/authoritative-simulation-worker-v174.js
          ! grep -q 'extension.paused || message.paused' dist/authoritative-simulation-worker-v174.js
          grep -q 'message.resumeIfMainRunning && paused' dist/authoritative-simulation-worker-v174.js
          grep -q 'Game.prototype.updateUI' dist/runtime-ui-v186.js
          grep -q 'Захватите командный центр противника пехотой' dist/runtime-ui-v186.js
          ! grep -qi 'осталось' dist/runtime-ui-v186.js
          python -m py_compile scripts/assemble186.py
          node --check dist/runtime-ui-v186.js
          node --check dist/authoritative-simulation-v174.js
          node --check dist/authoritative-simulation-worker-v174.js
          node --check dist/simulation-profiler-v166.js
          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Browser command and production regression test
        run: |
          set -euo pipefail
          rm -rf smoke-root /tmp/fd-smoke-chrome
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium/Chrome on runner"; exit 1; }
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fd-smoke-chrome "http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=186" >/tmp/fd-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT
          FD_DEBUG_PORT=9222 node tests/browser-smoke186.mjs

      - name: Publish complete static build to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.2 build 186"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
