name: Build Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble inherited simulation core through build 190
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          node tests/verify181.js
          node tests/verify182.generated.js dist/deep-operations-ai-v182.js
          node tests/verify183.generated.js dist
          node tests/verify184.js dist
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          node tests/verify190.js dist

      - name: Assemble v16.8.7 command scale and save recovery
        run: |
          set -euo pipefail
          python scripts/assemble191.py
          python scripts/finalize191.py

          for file in index.html frontline-dominion.html runtime-ui-v191.js runtime-shell-v191.js engineer-rocket-parity-v191.js command-watchdog-v191.js save-compat-v191.js formation-march-core-v183.js screen-selection-formation-v140.js unit-footprints-v115.js unit-formation-refinement-v138.js model-pilot-v101.js resource-extraction-v114.js authoritative-simulation-v174.js authoritative-simulation-worker-v174.js simulation-profiler-v166.js models/pilot/manifest.json models/canvas/b-51-views.webp; do
            test -s "dist/$file" || { echo "missing: $file"; exit 1; }
          done

          grep -q 'frontline-dominion.html?build=191' dist/index.html
          grep -q 'v16.8.7' dist/index.html
          grep -q 'fd-boot191-script' dist/frontline-dominion.html
          grep -q 'runtime-ui-v191.js?build=191' dist/frontline-dominion.html
          grep -q 'runtime-shell-v191.js?build=191' dist/frontline-dominion.html
          grep -q 'engineer-rocket-parity-v191.js?build=191' dist/frontline-dominion.html
          grep -q 'command-watchdog-v191.js?build=191' dist/frontline-dominion.html
          grep -q 'save-compat-v191.js?build=191' dist/frontline-dominion.html
          ! grep -q 'runtime-stability-v190.js' dist/frontline-dominion.html
          ! grep -q 'engineer-infantry-parity-v189.js' dist/frontline-dominion.html
          ! grep -q 'runtime-shell-v190.js' dist/frontline-dominion.html
          ! grep -q 'runtime-ui-v190.js' dist/frontline-dominion.html

          grep -q '__FD_ENGINEER_ROCKET_191__' dist/engineer-rocket-parity-v191.js
          grep -q "referenceType: 'rocket'" dist/engineer-rocket-parity-v191.js
          grep -q 'getInfantryRenderGeometry191' dist/engineer-rocket-parity-v191.js
          grep -q '__FD_COMMAND_WATCHDOG_191__' dist/command-watchdog-v191.js
          grep -q '__FD_SAVE_COMPAT_191__' dist/save-compat-v191.js
          grep -q 'legacy-source-build' dist/save-compat-v191.js
          grep -q 'backup-build${BUILD}' dist/runtime-shell-v191.js
          grep -q 'drawCatalogBuildingPlaceholder190' dist/model-pilot-v101.js
          grep -q "'B-51'" dist/model-pilot-v101.js
          ! grep -q 'ENGINEER_DISPLAY_SCALE = 2.85' dist/model-pilot-v101.js

          grep -q "const BUILD = 191" dist/authoritative-simulation-v174.js
          grep -q "const VERSION = '16.8.7'" dist/authoritative-simulation-v174.js
          grep -q 'authoritative-simulation-worker-v174.js?build=191' dist/authoritative-simulation-v174.js
          grep -q "const BUILD = 191" dist/authoritative-simulation-worker-v174.js
          grep -q "const VERSION = '16.8.7'" dist/authoritative-simulation-worker-v174.js
          grep -q 'engineer-rocket-parity-v191.js?build=191' dist/authoritative-simulation-worker-v174.js
          ! grep -q 'runtime-stability-v190.js' dist/authoritative-simulation-worker-v174.js

          python -m py_compile scripts/assemble189.py scripts/finalize189.py scripts/patch189_engineer_parity.py scripts/assemble190.py scripts/install190_runtime.py scripts/assemble191.py scripts/finalize191.py
          for file in dist/*.js; do node --check "$file"; done
          node --check tests/browser-regression191.mjs
          node --check tests/save-load191.mjs

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/frontline-dominion.html').read_text('utf-8')
          sources = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+\.js(?:\?build=\d+)?)["\']', html, flags=re.I)
          bad = [source for source in sources if not source.endswith('?build=191')]
          if bad:
              raise SystemExit(f'mixed cache generations: {bad}')
          if not sources or 'runtime-shell-v191.js?build=191' not in sources[-1]:
              raise SystemExit(f'canonical shell not last: {sources[-5:]}')
          required = [
              'engineer-rocket-parity-v191.js?build=191',
              'command-watchdog-v191.js?build=191',
              'save-compat-v191.js?build=191',
              'runtime-ui-v191.js?build=191',
              'runtime-shell-v191.js?build=191',
          ]
          for source in required:
              if html.count(source) != 1:
                  raise SystemExit(f'owner count invalid: {source}')
          if html.count('id="fd-boot191-script"') != 1:
              raise SystemExit('canonical boot owner count is not one')
          if html.count('data-fd-canonical-build="191"') != 1:
              raise SystemExit('canonical feature strip count is not one')
          if html.index('save-compat-v191.js?build=191') > html.index('runtime-shell-v191.js?build=191'):
              raise SystemExit('save compatibility must load before runtime shell')
          print('main-thread scripts:', len(sources), 'all build=191')
          PY

          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Install Chromium and WebKit browser gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Real browser command scale and save-load regression
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=191"
          FD_BROWSER=webkit FD_GAME_URL="$GAME_URL" node tests/browser-regression191.mjs
          FD_BROWSER=webkit FD_GAME_URL="$GAME_URL" node tests/save-load191.mjs
          FD_BROWSER=chromium FD_GAME_URL="$GAME_URL" node tests/browser-regression191.mjs
          FD_BROWSER=chromium FD_GAME_URL="$GAME_URL" node tests/save-load191.mjs

      - name: Publish complete static build to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.7 build 191"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
