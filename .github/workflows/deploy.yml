name: Build Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble inherited simulation core
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          node tests/verify181.js
          node tests/verify182.generated.js dist/deep-operations-ai-v182.js
          node tests/verify183.generated.js dist
          node tests/verify184.js dist
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py

      - name: Assemble v16.8.5 stable launch and formation
        run: |
          set -euo pipefail
          python scripts/assemble189.py
          for f in index.html frontline-dominion.html runtime-ui-v189.js runtime-shell-v189.js formation-march-core-v183.js screen-selection-formation-v140.js unit-footprints-v115.js unit-formation-refinement-v138.js authoritative-simulation-v174.js authoritative-simulation-worker-v174.js simulation-profiler-v166.js models/pilot/manifest.json; do
            test -s "dist/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q 'frontline-dominion.html?build=189' dist/index.html
          grep -q 'v16.8.5' dist/index.html
          grep -q 'fd-boot189-script' dist/frontline-dominion.html
          grep -q 'runtime-ui-v189.js?build=189' dist/frontline-dominion.html
          grep -q 'runtime-shell-v189.js?build=189' dist/frontline-dominion.html
          ! grep -q 'runtime-ui-v188.js' dist/frontline-dominion.html
          ! grep -q 'runtime-shell-v188.js' dist/frontline-dominion.html
          grep -q "const BUILD = 189" dist/formation-march-core-v183.js
          grep -q "const VERSION = '16.8.5'" dist/formation-march-core-v183.js
          grep -q 'optimizeFormationSlots189' dist/formation-march-core-v183.js
          grep -q 'state.formingTicks189 >= 24' dist/formation-march-core-v183.js
          grep -q 'march183?.build || 0) >= 189' dist/screen-selection-formation-v140.js
          ! grep -q 'ENGINEER_DISPLAY_SCALE = 2.85' dist/unit-footprints-v115.js
          ! grep -q 'ENGINEER_DISPLAY_SCALE = 2.85' dist/unit-formation-refinement-v138.js
          grep -q "const BUILD = 189" dist/authoritative-simulation-v174.js
          grep -q "const VERSION = '16.8.5'" dist/authoritative-simulation-v174.js
          grep -q "authoritative-simulation-worker-v174.js?build=189" dist/authoritative-simulation-v174.js
          grep -q "const BUILD = 189" dist/authoritative-simulation-worker-v174.js
          grep -q "const VERSION = '16.8.5'" dist/authoritative-simulation-worker-v174.js
          grep -q "formation-march-core-v183.js?build=189" dist/authoritative-simulation-worker-v174.js
          ! grep -q 'extension.paused || message.paused' dist/authoritative-simulation-worker-v174.js
          grep -q 'message.resumeIfMainRunning && paused' dist/authoritative-simulation-worker-v174.js
          python -m py_compile scripts/assemble189.py
          node --check dist/runtime-ui-v189.js
          node --check dist/runtime-shell-v189.js
          node --check dist/formation-march-core-v183.js
          node --check dist/screen-selection-formation-v140.js
          node --check dist/unit-footprints-v115.js
          node --check dist/unit-formation-refinement-v138.js
          node --check dist/authoritative-simulation-v174.js
          node --check dist/authoritative-simulation-worker-v174.js
          node tests/verify189.js dist
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('dist/frontline-dominion.html').read_text('utf-8')
          sources=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+\.js(?:\?build=\d+)?)["\']',html,flags=re.I)
          bad=[source for source in sources if not source.endswith('?build=189')]
          if bad: raise SystemExit(f'mixed cache generations: {bad}')
          if not sources or 'runtime-shell-v189.js?build=189' not in sources[-1]: raise SystemExit(f'canonical shell not last: {sources[-5:]}')
          if html.count('id="fd-boot189-script"') != 1: raise SystemExit('canonical boot owner count is not one')
          if html.count('data-fd-canonical-build="189"') != 1: raise SystemExit('canonical feature strip count is not one')
          print('main-thread scripts:',len(sources),'all build=189')
          PY
          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Install WebKit test browser
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps webkit
          python - <<'PY'
          from pathlib import Path
          text = Path('tests/browser-smoke187.mjs').read_text('utf-8')
          text = text.replace('187', '189')
          text = text.replace(r'16\.8\.3', r'16\.8\.5')
          text = text.replace('16.8.3', '16.8.5')
          Path('tests/browser-smoke189.generated.mjs').write_text(text, 'utf-8')
          PY
          grep -q 'v16\\.8\\.5' tests/browser-smoke189.generated.mjs

      - name: WebKit iPad canonical launch and engineer gate
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          FD_GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=189" node tests/webkit-gate189.mjs

      - name: Chromium render command and production gate
        run: |
          set -euo pipefail
          rm -rf smoke-root /tmp/fd-smoke-chrome
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium/Chrome on runner"; exit 1; }
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fd-smoke-chrome "http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=189" >/tmp/fd-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT
          FD_DEBUG_PORT=9222 node tests/browser-smoke189.generated.mjs

      - name: Publish complete static build to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.5 build 189"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
