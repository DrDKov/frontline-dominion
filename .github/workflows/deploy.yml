name: Build Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble inherited v16.8 core
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          node tests/verify181.js
          node tests/verify182.generated.js dist/deep-operations-ai-v182.js
          node tests/verify183.generated.js dist
          node tests/verify184.js dist
          python scripts/assemble185.py
          python scripts/assemble186.py

      - name: Assemble v16.8.3 Safari startup recovery
        run: |
          set -euo pipefail
          python scripts/assemble187.py
          for f in index.html frontline-dominion.html runtime-ui-v187.js runtime-shell-v187.js authoritative-simulation-v174.js authoritative-simulation-worker-v174.js simulation-profiler-v166.js models/pilot/manifest.json; do
            test -s "dist/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q 'frontline-dominion.html?build=187' dist/index.html
          grep -q 'v16.8.3' dist/index.html
          grep -q 'runtime-ui-v187.js?build=187' dist/frontline-dominion.html
          grep -q 'runtime-shell-v187.js?build=187' dist/frontline-dominion.html
          ! grep -q 'runtime-ui-v186.js' dist/frontline-dominion.html
          ! grep -q 'runtime-ui-v185.js' dist/frontline-dominion.html
          ! grep -q 'fd-boot183-script' dist/frontline-dominion.html
          ! grep -q 'fd-boot183-style' dist/frontline-dominion.html
          grep -q "const BUILD = 187" dist/authoritative-simulation-v174.js
          grep -q "const VERSION = '16.8.3'" dist/authoritative-simulation-v174.js
          grep -q "authoritative-simulation-worker-v174.js?build=187" dist/authoritative-simulation-v174.js
          grep -q 'resumeIfMainRunning' dist/authoritative-simulation-v174.js
          grep -q "const BUILD = 187" dist/authoritative-simulation-worker-v174.js
          grep -q "const VERSION = '16.8.3'" dist/authoritative-simulation-worker-v174.js
          ! grep -q 'extension.paused || message.paused' dist/authoritative-simulation-worker-v174.js
          grep -q 'message.resumeIfMainRunning && paused' dist/authoritative-simulation-worker-v174.js
          python -m py_compile scripts/assemble187.py
          node --check dist/runtime-ui-v187.js
          node --check dist/runtime-shell-v187.js
          node --check dist/authoritative-simulation-v174.js
          node --check dist/authoritative-simulation-worker-v174.js
          node --check dist/simulation-profiler-v166.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/frontline-dominion.html').read_text('utf-8')
          sources = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+\.js(?:\?build=\d+)?)["\']', html, flags=re.I)
          bad_cache = [s for s in sources if not s.endswith('?build=187')]
          if bad_cache:
              raise SystemExit(f'mixed main-thread cache generations: {bad_cache}')
          if not sources or 'runtime-shell-v187.js?build=187' not in sources[-1]:
              raise SystemExit(f'canonical shell is not last: {sources[-5:]}')
          inline = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          hits = []
          for block_i, block in enumerate(inline):
              for m in re.finditer(r'start-game', block):
                  lo=max(0,m.start()-2500); hi=min(len(block),m.end()+4000)
                  hits.append((block_i, block[lo:hi]))
          print('START_HANDLER_CONTEXTS', len(hits))
          for i,(block_i,snippet) in enumerate(hits[:12]):
              print(f'--- START CONTEXT {i} INLINE_BLOCK {block_i} ---')
              print(snippet)
              print('--- END CONTEXT ---')
          if not hits:
              raise SystemExit('no inline start-game handler context found')
          PY
          exit 91

      - name: Install WebKit test browser
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: WebKit iPad startup gate
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          FD_GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=187" node tests/webkit-diagnostic187.mjs

      - name: Chromium render, command and production gate
        run: |
          set -euo pipefail
          rm -rf smoke-root /tmp/fd-smoke-chrome
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium/Chrome on runner"; exit 1; }
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fd-smoke-chrome "http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=187" >/tmp/fd-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT
          FD_DEBUG_PORT=9222 node tests/browser-smoke187.mjs

      - name: Publish complete static build to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.3 build 187"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
