name: Build Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble v16.8 build 184
        run: |
          rm -rf dist
          python scripts/assemble184.py

      - name: Validate Action Group and Command Center Core
        run: |
          set -euo pipefail
          for f in \
            index.html \
            frontline-dominion.html \
            action-group-core-v184.js \
            construction-victory-v184.js \
            start-screen-stable-v184.js \
            formation-march-core-v183.js \
            fortress-defense-ai-v183.js \
            deep-operations-ai-v182.js \
            minimap-atomic-v181.js \
            minefield-defense-catalog-v181.js \
            combat-scale-core-v166.js \
            simulation-profiler-v166.js \
            fire-discipline-v177.js \
            authoritative-simulation-v174.js \
            authoritative-simulation-worker-v174.js \
            authoritative-simulation-bundle-v172.js \
            combined-arms-doctrine-v141.js \
            multiplayer-game-v96.js \
            models/pilot/manifest.json; do
            test -s "dist/$f" || { echo "missing: $f"; exit 1; }
          done

          grep -q 'frontline-dominion.html?build=184' dist/index.html
          ! grep -qi 'http-equiv=.*refresh' dist/index.html
          ! grep -Eq 'build=18[0-3]' dist/index.html
          grep -q 'action-group-core-v184.js?build=184' dist/frontline-dominion.html
          grep -q 'construction-victory-v184.js?build=184' dist/frontline-dominion.html
          grep -q 'start-screen-stable-v184.js?build=184' dist/frontline-dominion.html
          ! grep -q 'start-screen-stable-v183.js?build=183' dist/frontline-dominion.html
          grep -q 'simulation-profiler-v166.js?build=184' dist/frontline-dominion.html
          grep -q 'minefield-defense-catalog-v181.js?build=181' dist/frontline-dominion.html
          grep -q 'minimap-atomic-v181.js?build=181' dist/frontline-dominion.html

          grep -q "const BUILD = 184" dist/authoritative-simulation-v174.js
          grep -q "const VERSION = '16.8'" dist/authoritative-simulation-v174.js
          grep -q "const BUILD = 184" dist/authoritative-simulation-worker-v174.js
          grep -q "const VERSION = '16.8'" dist/authoritative-simulation-worker-v174.js
          grep -q "action-group-core-v184.js?build=184" dist/authoritative-simulation-worker-v174.js
          grep -q "construction-victory-v184.js?build=184" dist/authoritative-simulation-worker-v174.js
          grep -q 'action184: game.actionGroupDiagnostics184' dist/authoritative-simulation-worker-v174.js
          grep -q 'objective184: game.constructionVictoryDiagnostics184' dist/authoritative-simulation-worker-v174.js

          grep -q 'individualUpdatesAvoided' dist/action-group-core-v184.js
          grep -q 'offscreenSteps' dist/action-group-core-v184.js
          grep -q 'COMBAT_SCAN_INTERVAL' dist/action-group-core-v184.js
          grep -q 'renderMembersAvoided' dist/action-group-core-v184.js
          grep -q 'pendingSensors' dist/construction-victory-v184.js
          grep -q 'capture-command-center' dist/construction-victory-v184.js
          grep -q 'CAPTURE_SECONDS = 8' dist/construction-victory-v184.js
          grep -q 'legacyEndsSuppressed' dist/construction-victory-v184.js
          grep -q 'added184 === false' dist/fortress-defense-ai-v183.js
          grep -q 'added184 === false' dist/deep-operations-ai-v182.js
          grep -q 'building.buildProgress ?? building.construction' dist/deep-operations-ai-v182.js

          grep -q 'individualMovementAvoided' dist/formation-march-core-v183.js
          grep -q 'offensiveLaunchesBlocked' dist/fortress-defense-ai-v183.js
          grep -q "RECON: 'reconnaissance'" dist/deep-operations-ai-v182.js
          grep -q 'single outer owner' dist/minimap-atomic-v181.js
          grep -q 'data-minefield-defense181' dist/minefield-defense-catalog-v181.js
          grep -q 'playerDirectedBuild178' dist/combined-arms-doctrine-v141.js
          grep -q 'no minefield perimeter/radius overlay' dist/combined-arms-doctrine-v141.js
          grep -q 'fireDiscipline177' dist/authoritative-simulation-worker-v174.js

          python - <<'PY'
          from pathlib import Path
          html = Path('dist/frontline-dominion.html').read_text('utf-8')
          index = Path('dist/index.html').read_text('utf-8')
          assert index.count('frontline-dominion.html?build=184') == 1
          assert 'http-equiv="refresh"' not in index.lower()
          assert html.count('action-group-core-v184.js?build=184') == 1
          assert html.count('construction-victory-v184.js?build=184') == 1
          assert html.count('start-screen-stable-v184.js?build=184') == 1
          assert html.count('deep-operations-ai-v182.js?build=182') == 1
          assert html.count('minefield-defense-catalog-v181.js?build=181') == 1
          assert html.count('minimap-atomic-v181.js?build=181') == 1
          assert 'minimap-stability-v176.js' not in html
          assert html.rfind('fortress-defense-ai-v183.js?build=183') < html.rfind('action-group-core-v184.js?build=184')
          assert html.rfind('action-group-core-v184.js?build=184') < html.rfind('construction-victory-v184.js?build=184')
          assert html.rfind('construction-victory-v184.js?build=184') < html.rfind('simulation-profiler-v166.js?build=184')
          assert html.rfind('start-screen-stable-v184.js?build=184') < html.rfind('minimap-atomic-v181.js?build=181')
          PY

          python -m py_compile scripts/assemble184.py
          node --check dist/action-group-core-v184.js
          node --check dist/construction-victory-v184.js
          node --check dist/start-screen-stable-v184.js
          node --check dist/formation-march-core-v183.js
          node --check dist/fortress-defense-ai-v183.js
          node --check dist/deep-operations-ai-v182.js
          node --check dist/minimap-atomic-v181.js
          node --check dist/minefield-defense-catalog-v181.js
          node --check dist/combat-scale-core-v166.js
          node --check dist/simulation-profiler-v166.js
          node --check dist/authoritative-simulation-v174.js
          node --check dist/authoritative-simulation-worker-v174.js
          node tests/verify181.js
          node tests/verify182.generated.js dist/deep-operations-ai-v182.js
          node tests/verify183.generated.js dist
          node tests/verify184.js dist

          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Publish complete static build to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8 build 184"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
