name: Stage 1b executor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage1b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add PR 17 regression gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_once(text, anchor, addition, path):
              if addition in text:
                  return text
              n = text.count(anchor)
              if n != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {n}: {anchor!r}')
              return text.replace(anchor, anchor + '\n' + addition, 1)

          edits = {
              '.github/workflows/release213-v3.yml': [
                  ("      - 'tests/build213-regression-v2.mjs'", "      - 'tests/logistics211-service-replan.mjs'"),
                  ("          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js", "          grep -q 'serviceReplanOnUndeliverable:true' dist/supply-transport-v206.js"),
                  ("          node --check tests/screen-direction213.mjs", "          node --check tests/logistics211-service-replan.mjs"),
                  ("          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-missions.generated.mjs 2>&1 | tee /tmp/fd213-inherited-missions.log", "          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-service-replan.mjs 2>&1 | tee /tmp/fd213-service-replan.log"),
              ],
              '.github/workflows/release214.yml': [
                  ("      - 'tests/build213-regression-v2.mjs'", "      - 'tests/logistics211-service-replan.mjs'"),
                  ("          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js", "          grep -q 'serviceReplanOnUndeliverable:true' dist/supply-transport-v206.js"),
                  ("          node --check tests/build213-regression-v2.mjs", "          node --check tests/logistics211-service-replan.mjs"),
                  ("          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-missions.generated.mjs 2>&1 | tee /tmp/fd214-inherited-missions.log", "          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-service-replan.mjs 2>&1 | tee /tmp/fd214-service-replan.log"),
              ],
          }
          for path, rules in edits.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for anchor, addition in rules:
                  text = insert_after_once(text, anchor, addition, path)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Vendor pinned src legacy and verify offline build
        run: |
          set -euo pipefail
          python scripts/build.py --from-published
          python scripts/vendor_src_legacy.py --dist dist
          pinned_count="$(find src/legacy -type f ! -name PROVENANCE.md | wc -l | tr -d ' ')"
          test "$pinned_count" = '836'
          python scripts/build.py --from-src
          test -s dist/frontline-dominion.html

      - name: Restore executor workflow and commit Stage 1b
        run: |
          set -euo pipefail
          cat > .github/workflows/deploy.yml <<'EOF'
          name: Legacy Frontline Dominion publisher (disabled)

          on:
            workflow_dispatch:

          jobs:
            disabled:
              runs-on: ubuntu-latest
              steps:
                - run: echo "Legacy publisher disabled; use release197.yml"
          EOF
          rm -f .github/workflows/stage1b-maintenance.yml
          rm -f stage1b-trigger.txt stage1b-merge-trigger.txt stage1b-native-trigger-2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows src/legacy stage1b-trigger.txt stage1b-merge-trigger.txt stage1b-native-trigger-2.txt 2>/dev/null || true
          git add .github/workflows/release213-v3.yml .github/workflows/release214.yml .github/workflows/deploy.yml .github/workflows/vendor-src-legacy.yml src/legacy
          git add -u
          git commit -m 'stage1b: vendor src legacy and complete CI coverage'
          git push origin HEAD:main

      - name: Delete stale build211 service-replan branches
        run: |
          set -euo pipefail
          for branch in build211-service-replan build211-service-replan-v2 build211-service-replan-v3; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Final verification
        run: |
          set -euo pipefail
          test "$(find src/legacy -type f ! -name PROVENANCE.md | wc -l | tr -d ' ')" = '836'
          grep -q "tests/logistics211-service-replan.mjs" .github/workflows/release213-v3.yml
          grep -q "serviceReplanOnUndeliverable:true" .github/workflows/release213-v3.yml
          grep -q "tests/logistics211-service-replan.mjs" .github/workflows/release214.yml
          grep -q "serviceReplanOnUndeliverable:true" .github/workflows/release214.yml
          test -f src/legacy/PROVENANCE.md
          echo 'Stage 1b complete.'
