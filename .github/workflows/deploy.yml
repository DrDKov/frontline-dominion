name: Deploy Frontline Dominion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontline-pages
  cancel-in-progress: true

env:
  BASE_URL: https://frontline-dominion.leonardjones2017.chatgpt.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Assemble build 177
        run: |
          rm -rf dist
          python scripts/assemble177.py

      - name: Validate assembled game
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/frontline-dominion.html
          test -s dist/fire-discipline-v177.js
          test -s dist/minimap-stability-v176.js
          test -s dist/authoritative-simulation-v174.js
          test -s dist/authoritative-simulation-worker-v174.js
          test -s dist/multiplayer-game-v96.js
          test -s dist/models/pilot/manifest.json
          grep -q 'fire-discipline-v177.js?build=177' dist/frontline-dominion.html
          grep -q 'minimap-stability-v176.js?build=176' dist/frontline-dominion.html
          grep -q "case 'fireDiscipline177'" dist/authoritative-simulation-worker-v174.js
          grep -q "case 'fireDiscipline177'" dist/multiplayer-game-v96.js
          count=$(find dist/models -type f | wc -l)
          echo "model/sprite files: $count"
          test "$count" -gt 700

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
