name: Build 196 Worker Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-build-196-hotfix
  cancel-in-progress: true

jobs:
  build196:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble build 196
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          grep -q 'frontline-dominion.html?build=196' dist/index.html
          grep -q 'v16.8.12' dist/index.html
          grep -q 'formationInstalled196' dist/formation-obstacle-recovery-v196.js
          grep -q 'hasDocument && typeof baseHydrate' dist/post-load-command-recovery-v196.js
          for file in dist/*.js; do node --check "$file"; done
          node tests/formation-obstacle196.unit.mjs

      - name: Install browser gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Run gameplay regression gates
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=196"

          sed -e 's/build=192/build=196/g' \
              -e "s/dataset.fdBuild === '192'/dataset.fdBuild === '196'/g" \
              tests/resource-dispatch192.mjs > tests/resource-dispatch196.generated.mjs
          sed -e 's/build=192/build=196/g' \
              -e "s/dataset.fdBuild === '192'/dataset.fdBuild === '196'/g" \
              -e 's/if (game.explored?.fill) game.explored.fill(1);/if (game.explored?.fill) game.explored.fill(1); if (game.visible?.fill) game.visible.fill(1);/' \
              tests/resource-build192.mjs > tests/resource-build196.generated.mjs
          sed -e 's/__FD_RUNTIME_SHELL_191__/__FD_RUNTIME_SHELL_196__/g' \
              -e 's/newGame.build !== 191/newGame.build !== 196/g' \
              -e 's/frontline-dominion.html?build=191/frontline-dominion.html?build=196/g' \
              tests/save-load191.mjs > tests/save-load196.generated.mjs
          sed -e 's/frontline-dominion.html?build=195/frontline-dominion.html?build=196/g' \
              -e 's/__FD_RUNTIME_SHELL_195__/__FD_RUNTIME_SHELL_196__/g' \
              -e 's/Number(document.documentElement.dataset.fdBuild || 0) === 195/Number(document.documentElement.dataset.fdBuild || 0) === 196/g' \
              -e 's/profiler.build !== 195/profiler.build !== 196/g' \
              -e "s/profiler.version !== '16.8.11'/profiler.version !== '16.8.12'/g" \
              tests/visual-lod195.mjs > tests/visual-lod196.generated.mjs

          node --check tests/building-selection196.mjs
          node --check tests/save-command196.mjs
          node --check tests/resource-build196.generated.mjs
          node --check tests/visual-lod196.generated.mjs

          for BROWSER in webkit chromium; do
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/building-selection196.mjs
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/resource-dispatch196.generated.mjs
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/resource-build196.generated.mjs
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/save-load196.generated.mjs
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/save-command196.mjs
            FD_BROWSER=$BROWSER FD_GAME_URL="$GAME_URL" node tests/visual-lod196.generated.mjs
          done

      - name: Publish build 196 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.12 build 196"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
