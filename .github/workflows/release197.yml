name: Release Frontline Dominion build 197

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-release-197
  cancel-in-progress: true

jobs:
  release197:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble Frontline Dominion v16.8.13 build 197
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py

      - name: Static and deterministic regression gates
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/frontline-dominion.html
          test -s dist/building-selection-invariance-v197.js
          test -s dist/formation-target-fidelity-v197.js
          test -s dist/runtime-ui-v197.js
          test -s dist/runtime-shell-v197.js
          grep -q 'frontline-dominion.html?build=197' dist/index.html
          grep -q 'v16.8.13' dist/index.html
          grep -q 'data-fd-canonical-build="197"' dist/frontline-dominion.html
          grep -q 'building-selection-invariance-v197.js?build=197' dist/frontline-dominion.html
          grep -q 'formation-target-fidelity-v197.js?build=197' dist/frontline-dominion.html
          grep -q 'runtime-ui-v197.js?build=197' dist/frontline-dominion.html
          grep -q 'runtime-shell-v197.js?build=197' dist/frontline-dominion.html
          grep -q 'formation-target-fidelity-v197.js?build=197' dist/authoritative-simulation-worker-v174.js
          ! grep -q 'post-load-command-recovery-v196.js' dist/authoritative-simulation-worker-v174.js
          grep -q '__FD_BUILDING_SELECTION_INVARIANCE_197__' dist/building-selection-invariance-v197.js
          grep -q '__FD_FORMATION_TARGET_FIDELITY_197__' dist/formation-target-fidelity-v197.js
          grep -q 'tagIssuedOrder(game, unitIds' dist/formation-target-fidelity-v197.js
          grep -q 'Build 197 move target was not attached to authoritative commands' dist/authoritative-simulation-worker-v174.js
          grep -q 'Build 197 attack-move target was not attached to authoritative commands' dist/authoritative-simulation-worker-v174.js
          grep -q 'Build 197 context move target was not attached to authoritative commands' dist/authoritative-simulation-worker-v174.js
          python -m py_compile scripts/assemble197.py scripts/hotfix197_worker_action_target.py
          for file in dist/*.js; do node --check "$file"; done
          node --check tests/building-selection197.unit.mjs
          node --check tests/formation-target197.unit.mjs
          node --check tests/selection-target197.mjs
          node --check tests/target197-diagnostic.mjs
          node tests/building-selection197.unit.mjs
          node tests/formation-target197.unit.mjs
          count=$(find dist/models -type f | wc -l)
          test "$count" -gt 700

      - name: Install Chromium and WebKit
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Physical selection and right-click target gates
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd197-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=197"
          FD_GAME_URL="$GAME_URL" node tests/target197-diagnostic.mjs
          FD_BROWSER=webkit FD_GAME_URL="$GAME_URL" node tests/selection-target197.mjs
          FD_BROWSER=chromium FD_GAME_URL="$GAME_URL" node tests/selection-target197.mjs

      - name: Publish build 197 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.13 build 197"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
