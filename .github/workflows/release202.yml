name: Release Frontline Dominion build 202

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-release-202
  cancel-in-progress: true

jobs:
  release202:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish active run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-status
          mkdir release-status
          cat > release-status/current.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "head_sha": "${GITHUB_SHA}",
            "status": "in_progress",
            "workflow": "${GITHUB_WORKFLOW}",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd release-status
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release-status
          git add current.json
          git commit -m "Build 202 run ${GITHUB_RUN_ID} started"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release-status

      - name: Assemble Frontline Dominion v16.8.18 build 202
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py

      - name: Static and deterministic regression gates
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/frontline-dominion.html
          test -s dist/command-power-authority-v202.js
          test -s dist/runtime-ui-v202.js
          test -s dist/runtime-shell-v202.js
          grep -q 'frontline-dominion.html?build=202' dist/index.html
          grep -q 'v16.8.18' dist/index.html
          grep -q 'data-fd-canonical-build="202"' dist/frontline-dominion.html
          grep -q 'command-power-authority-v202.js?build=202' dist/frontline-dominion.html
          grep -q 'runtime-shell-v202.js?build=202' dist/frontline-dominion.html
          grep -q 'command-power-authority-v202.js?build=202' dist/authoritative-simulation-worker-v174.js
          grep -q "powerState:this.commandPowerIntent202" dist/authoritative-simulation-v174.js
          grep -q 'previousPowerIntent202' dist/authoritative-simulation-worker-v174.js
          grep -q 'commandPower202:' dist/authoritative-simulation-worker-v174.js
          grep -q '__FD_COMMAND_POWER_AUTHORITY_202__' dist/command-power-authority-v202.js
          ! grep -q 'runtime-shell-v201.js?build=202' dist/frontline-dominion.html
          python -m py_compile scripts/assemble202.py scripts/generate202_tests.py
          for file in dist/*.js; do node --check "$file"; done
          node --check tests/recon-energy202.mjs
          node tests/command-power202.unit.mjs
          node tests/resilience200.unit.mjs
          node tests/building-selection197.unit.mjs
          node tests/building-model-hit201.unit.mjs
          node tests/formation-target197.unit.mjs
          node tests/group-movement201.unit.mjs
          count=$(find dist/models -type f | wc -l)
          test "$count" -gt 700

      - name: Install Chromium and generate browser gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          python scripts/generate202_tests.py
          node --check tests/reliability202.generated.mjs
          node --check tests/movement202.generated.mjs
          node --check tests/save-load202.generated.mjs
          node --check tests/user-fixes202.generated.mjs
          node --check tests/user-fixes202-recon.generated.mjs
          node --check tests/worker-recovery202.generated.mjs

      - name: Physical Chromium release gates
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd202-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          GAME_URL="http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=202"
          FD_BROWSER=chromium FD_GAME_URL="$GAME_URL" node tests/reliability202.generated.mjs
          FD_BROWSER=chromium FD_GAME_URL="$GAME_URL" node tests/movement202.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/user-fixes202.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/user-fixes202-recon.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/save-load202.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/worker-recovery202.generated.mjs
          FD_GAME_URL="$GAME_URL" node tests/recon-energy202.mjs

      - name: Publish build 202 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.8.18 build 202"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify published build 202
        run: |
          set -euo pipefail
          PUBLIC_URL="https://drdkov.github.io/frontline-dominion/frontline-dominion.html?build=202&verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 60); do
            if curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_URL" > /tmp/fd202-public.html && \
               grep -q 'data-fd-canonical-build="202"' /tmp/fd202-public.html && \
               grep -q 'command-power-authority-v202.js?build=202' /tmp/fd202-public.html && \
               grep -q 'runtime-shell-v202.js?build=202' /tmp/fd202-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          FD_BROWSER=chromium FD_GAME_URL="$PUBLIC_URL" node tests/reliability202.generated.mjs
          FD_BROWSER=chromium FD_GAME_URL="$PUBLIC_URL" node tests/movement202.generated.mjs
          FD_GAME_URL="$PUBLIC_URL" node tests/user-fixes202.generated.mjs
          FD_GAME_URL="$PUBLIC_URL" node tests/user-fixes202-recon.generated.mjs
          FD_GAME_URL="$PUBLIC_URL" node tests/save-load202.generated.mjs
          FD_GAME_URL="$PUBLIC_URL" node tests/worker-recovery202.generated.mjs
          FD_GAME_URL="$PUBLIC_URL" node tests/recon-energy202.mjs

      - name: Publish final run result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf release-status
          mkdir release-status
          cat > release-status/current.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "head_sha": "${GITHUB_SHA}",
            "status": "${JOB_STATUS}",
            "workflow": "${GITHUB_WORKFLOW}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd release-status
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release-status
          git add current.json
          git commit -m "Build 202 run ${GITHUB_RUN_ID} ${JOB_STATUS}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release-status
