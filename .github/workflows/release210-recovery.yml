name: Recover Frontline Dominion build 210 logistics UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release210-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-current-publication
  cancel-in-progress: true

jobs:
  recover210:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble canonical build 210
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py
          python scripts/assemble205.py
          python scripts/assemble206.py
          python scripts/hotfix206_logistics_state.py
          python scripts/hotfix206_truck_commands.py
          python scripts/hotfix206_multiplayer_hash.py
          python scripts/hotfix206_deterministic_geometry.py
          python scripts/hotfix206_multiplayer_initial_state.py
          python scripts/hotfix206_resync_snapshot.py
          python scripts/hotfix206_resync_continuity.py
          python scripts/hotfix206_network_components.py
          python scripts/hotfix206_initial_signature.py
          python scripts/hotfix206_ai_trace_diagnostics.py
          python scripts/install206_ui.py
          python scripts/patch206_invariant_harness.py
          python scripts/assemble207.py
          python scripts/assemble208.py
          python scripts/hotfix208_logistics_replication.py
          python scripts/assemble209.py
          python scripts/assemble210.py

      - name: Static logistics restoration gates
        run: |
          set -euo pipefail
          test -s dist/frontline-dominion.html
          test -s dist/gameplay-v208.js
          test -s dist/logistics-ui-v208.js
          test -s dist/logistics-core-v206.js
          test -s dist/runtime-ui-v210.js
          test -s dist/runtime-shell-v210.js
          test -s dist/save-slots-v210.js
          grep -q 'data-fd-canonical-build="210"' dist/frontline-dominion.html
          grep -q 'gameplay-v208.js?build=210' dist/frontline-dominion.html
          grep -q 'logistics-ui-v208.js?build=210' dist/frontline-dominion.html
          grep -q 'runtime-ui-v210.js?build=210' dist/frontline-dominion.html
          grep -q 'runtime-shell-v210.js?build=210' dist/frontline-dominion.html
          grep -q 'save-slots-v210.js?build=210' dist/frontline-dominion.html
          grep -q 'fd-fuel-resource207' dist/logistics-ui-v208.js
          grep -q "tab.textContent='Логистика'" dist/logistics-ui-v208.js
          grep -q "L.totalPhysical(game,'player').fuel" dist/logistics-ui-v208.js
          grep -q '__FD_LOGISTICS_UI208__' dist/logistics-ui-v208.js
          grep -q '__FD_GAMEPLAY_208__' dist/gameplay-v208.js
          grep -q '__FD_SCREEN_INPUT_FIDELITY_210__' dist/command-input-v190.js
          ! grep -q 'data-fd-canonical-build="205"' dist/frontline-dominion.html
          python -m py_compile scripts/assemble210.py scripts/generate210_tests.py
          node --check tests/logistics-ui210.mjs
          for file in dist/*.js; do node --check "$file"; done
          count=$(find dist/models -type f | wc -l)
          test "$count" -gt 700

      - name: Install Chromium and generate inherited gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          python scripts/generate210_tests.py
          node --check tests/save-slots210.generated.mjs
          node --check tests/free-group-direction210.generated.mjs

      - name: Physical local restoration gates
        run: |
          set -euo pipefail
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd210-recovery-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          BASE_URL='http://127.0.0.1:8765/frontline-dominion'
          GAME_URL="$BASE_URL/frontline-dominion.html?build=210"
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsSL "$GAME_URL" >/tmp/fd210-recovery-local.html; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          grep -q 'data-fd-canonical-build="210"' /tmp/fd210-recovery-local.html
          grep -q 'logistics-ui-v208.js?build=210' /tmp/fd210-recovery-local.html
          FD_BASE_URL="$BASE_URL" node tests/logistics206-invariants.mjs 2>&1 | tee /tmp/fd210-recovery-invariants.log
          FD_GAME_URL="$GAME_URL" node tests/worker207-bootstrap.mjs 2>&1 | tee /tmp/fd210-recovery-bootstrap.log
          FD_GAME_URL="$GAME_URL" node tests/logistics-ui210.mjs 2>&1 | tee /tmp/fd210-recovery-ui.log
          FD_GAME_URL="$GAME_URL" node tests/logistics208-controls-v2.mjs 2>&1 | tee /tmp/fd210-recovery-logistics.log
          FD_GAME_URL="$GAME_URL" node tests/construction208-all-buildings-v2.mjs 2>&1 | tee /tmp/fd210-recovery-construction.log
          FD_GAME_URL="$GAME_URL" node tests/screen-direction210.mjs 2>&1 | tee /tmp/fd210-recovery-screen.log
          FD_GAME_URL="$GAME_URL" node tests/free-group-direction210.generated.mjs 2>&1 | tee /tmp/fd210-recovery-direction.log
          FD_GAME_URL="$GAME_URL" node tests/save-slots210.generated.mjs 2>&1 | tee /tmp/fd210-recovery-save.log

      - name: Publish recovered build 210 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Frontline Dominion v16.9.4 build 210 logistics recovery"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify public Fuel and Logistics UI
        run: |
          set -euo pipefail
          PUBLIC_ROOT='https://drdkov.github.io/frontline-dominion'
          PUBLIC_GAME="$PUBLIC_ROOT/frontline-dominion.html?build=210&verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 60); do
            if curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_GAME" >/tmp/fd210-recovery-public.html && \
               grep -q 'data-fd-canonical-build="210"' /tmp/fd210-recovery-public.html && \
               grep -q 'gameplay-v208.js?build=210' /tmp/fd210-recovery-public.html && \
               grep -q 'logistics-ui-v208.js?build=210' /tmp/fd210-recovery-public.html && \
               curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_ROOT/logistics-ui-v208.js?build=210&verify=${GITHUB_SHA}" >/tmp/fd210-recovery-public-logistics-ui.js && \
               grep -q 'fd-fuel-resource207' /tmp/fd210-recovery-public-logistics-ui.js && \
               grep -q "tab.textContent='Логистика'" /tmp/fd210-recovery-public-logistics-ui.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          FD_GAME_URL="$PUBLIC_GAME" node tests/logistics-ui210.mjs 2>&1 | tee /tmp/fd210-recovery-public-ui.log
          FD_GAME_URL="$PUBLIC_GAME" node tests/logistics208-controls-v2.mjs 2>&1 | tee /tmp/fd210-recovery-public-logistics.log
          FD_GAME_URL="$PUBLIC_GAME" node tests/screen-direction210.mjs 2>&1 | tee /tmp/fd210-recovery-public-screen.log

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd210-logistics-recovery-diagnostics
          path: |
            /tmp/fd210-recovery-*.log
            /tmp/fd210-recovery-*.html
            /tmp/fd210-recovery-*.js
          if-no-files-found: ignore
          retention-days: 3
