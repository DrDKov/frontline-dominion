name: Release Frontline Dominion build 214

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release214.yml'
      - 'scripts/assemble214.py'
      - 'scripts/hotfix214_ai_extraction_priority.py'
      - 'src/v214/**'
      - 'tests/build214-regression.mjs'
      - 'tests/worker214-bootstrap.mjs'
      - 'tests/screen-direction214.mjs'
      - 'tests/build213-regression.mjs'
      - 'tests/build213-regression-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-current-publication
  cancel-in-progress: true

jobs:
  release214:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble canonical build 214
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/assemble184.py
          python scripts/assemble185.py
          python scripts/assemble186.py
          python scripts/assemble187.py
          python scripts/assemble189.py
          python scripts/finalize189.py
          python scripts/patch189_engineer_parity.py
          python scripts/assemble190.py
          python scripts/install190_runtime.py
          python scripts/assemble191.py
          python scripts/finalize191.py
          python scripts/assemble192.py
          python scripts/finalize192.py
          python scripts/assemble193.py
          python scripts/assemble194.py
          python scripts/assemble195.py
          python scripts/assemble196.py
          python scripts/hotfix196_worker_descriptors.py
          python scripts/hotfix196_worker_scope.py
          python scripts/assemble197.py
          python scripts/hotfix197_worker_action_target.py
          python scripts/hotfix197_input_authority.py
          python scripts/assemble198.py
          python scripts/assemble199.py
          python scripts/hotfix199_runtime.py
          python scripts/assemble200.py
          python scripts/assemble201.py
          python scripts/assemble202.py
          python scripts/assemble203.py
          python scripts/assemble204.py
          python scripts/assemble205.py
          python scripts/assemble206.py
          python scripts/hotfix206_logistics_state.py
          python scripts/hotfix206_truck_commands.py
          python scripts/hotfix206_multiplayer_hash.py
          python scripts/hotfix206_deterministic_geometry.py
          python scripts/hotfix206_multiplayer_initial_state.py
          python scripts/hotfix206_resync_snapshot.py
          python scripts/hotfix206_resync_continuity.py
          python scripts/hotfix206_network_components.py
          python scripts/hotfix206_initial_signature.py
          python scripts/hotfix206_ai_trace_diagnostics.py
          python scripts/install206_ui.py
          python scripts/patch206_invariant_harness.py
          python scripts/assemble207.py
          python scripts/assemble208.py
          python scripts/hotfix208_logistics_replication.py
          python scripts/assemble209.py
          python scripts/assemble210.py
          python scripts/run_assemble211.py
          python scripts/hotfix211_manual_source_v2.py
          python scripts/assemble212.py
          python scripts/assemble213.py
          python scripts/hotfix213_boot_bridge.py
          python scripts/hotfix213_footprint_dock.py
          python scripts/assemble214.py
          python scripts/hotfix214_ai_extraction_priority.py

      - name: Static build 214 gates
        run: |
          set -euo pipefail
          test -s dist/frontline-dominion.html
          test -s dist/transport-fire-v214.js
          test -s dist/ai-economy-logistics-v214.js
          test -s dist/friendly-extractor-visibility-v213.js
          test -s dist/runtime-shell-v214.js
          test -s dist/runtime-ui-v214.js
          test -s dist/save-slots-v214.js
          grep -q 'data-fd-canonical-build="214"' dist/frontline-dominion.html
          grep -q 'transport-fire-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'ai-economy-logistics-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'runtime-shell-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'save-slots-v214.js?build=214' dist/frontline-dominion.html
          grep -q '__FD_BOOT_214__' dist/frontline-dominion.html
          grep -q 'transport-fire-v214.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'ai-economy-logistics-v214.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'groundPassengersFire: true' dist/transport-fire-v214.js
          grep -q 'aviationExcluded: true' dist/transport-fire-v214.js
          grep -q 'extractionHauling:true' dist/ai-economy-logistics-v214.js
          grep -q 'storedReservePlanning:true' dist/ai-economy-logistics-v214.js
          grep -q '__FD_AI_EXTRACTION_PRIORITY_214__' dist/ai-economy-logistics-v214.js
          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js
          grep -q 'friendlyExtractorFogPinning: true' dist/friendly-extractor-visibility-v213.js
          python -m py_compile scripts/assemble214.py scripts/hotfix214_ai_extraction_priority.py
          node --check tests/build214-regression.mjs
          node --check tests/worker214-bootstrap.mjs
          node --check tests/screen-direction214.mjs
          node --check tests/build213-regression-v2.mjs
          for file in dist/*.js; do node --check "$file"; done

      - name: Install Chromium and generate inherited gates
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          python scripts/generate210_tests.py
          python scripts/generate211_tests.py

      - name: Local build 214 regression gates
        run: |
          set -euo pipefail
          rm -rf smoke-root && mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd214-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          BASE_URL='http://127.0.0.1:8765/frontline-dominion'
          GAME_URL="$BASE_URL/frontline-dominion.html?build=214"
          ready=0
          for attempt in $(seq 1 80); do
            if curl -fsSL "$GAME_URL" >/tmp/fd214-local.html; then ready=1; break; fi
            sleep .1
          done
          test "$ready" -eq 1
          grep -q 'data-fd-canonical-build="214"' /tmp/fd214-local.html
          FD_BASE_URL="$BASE_URL" node tests/logistics206-invariants.mjs 2>&1 | tee /tmp/fd214-invariants.log
          FD_GAME_URL="$GAME_URL" node tests/worker214-bootstrap.mjs 2>&1 | tee /tmp/fd214-bootstrap.log
          FD_GAME_URL="$GAME_URL" node tests/logistics211-service.generated.mjs 2>&1 | tee /tmp/fd214-inherited-service.log
          FD_GAME_URL="$GAME_URL" node tests/logistics211-missions.generated.mjs 2>&1 | tee /tmp/fd214-inherited-missions.log
          FD_GAME_URL="$GAME_URL" node tests/build212-regression.mjs 2>&1 | tee /tmp/fd214-inherited-212.log
          FD_GAME_URL="$GAME_URL" node tests/build213-regression-v2.mjs 2>&1 | tee /tmp/fd214-inherited-213.log
          FD_GAME_URL="$GAME_URL" node tests/screen-direction214.mjs 2>&1 | tee /tmp/fd214-screen.log
          FD_GAME_URL="$GAME_URL" node tests/build214-regression.mjs 2>&1 | tee /tmp/fd214-regression.log

      - name: Publish build 214 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m 'Frontline Dominion v16.9.8 build 214 passenger fire and AI logistics'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify public build 214
        run: |
          set -euo pipefail
          PUBLIC_ROOT='https://drdkov.github.io/frontline-dominion'
          PUBLIC_GAME="$PUBLIC_ROOT/frontline-dominion.html?build=214&verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 90); do
            if curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_GAME" >/tmp/fd214-public.html && \
               grep -q 'data-fd-canonical-build="214"' /tmp/fd214-public.html && \
               grep -q 'transport-fire-v214.js?build=214' /tmp/fd214-public.html && \
               grep -q 'ai-economy-logistics-v214.js?build=214' /tmp/fd214-public.html; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_ROOT/transport-fire-v214.js?build=214&verify=${GITHUB_SHA}" >/tmp/fd214-public-transport.js
          curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_ROOT/ai-economy-logistics-v214.js?build=214&verify=${GITHUB_SHA}" >/tmp/fd214-public-ai.js
          grep -q '__FD_TRANSPORT_FIRE_214__' /tmp/fd214-public-transport.js
          grep -q '__FD_AI_ECONOMY_LOGISTICS_214__' /tmp/fd214-public-ai.js
          FD_GAME_URL="$PUBLIC_GAME" node tests/worker214-bootstrap.mjs 2>&1 | tee /tmp/fd214-public-bootstrap.log
          FD_GAME_URL="$PUBLIC_GAME" node tests/build213-regression-v2.mjs 2>&1 | tee /tmp/fd214-public-213.log
          FD_GAME_URL="$PUBLIC_GAME" node tests/build214-regression.mjs 2>&1 | tee /tmp/fd214-public-regression.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd214-release-diagnostics
          path: |
            /tmp/fd214-*.log
            /tmp/fd214-*.html
            /tmp/fd214-*.js
          if-no-files-found: ignore
          retention-days: 3
