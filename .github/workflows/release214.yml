name: Release Frontline Dominion build 214

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release214.yml'
      - 'scripts/build.py'
      - 'scripts/legacy-manifest.json'
      - 'scripts/assemble214.py'
      - 'scripts/hotfix214_ai_extraction_priority.py'
      - 'src/legacy/**'
      - 'src/version.js'
      - 'src/manifest.json'
      - 'tests/runtime-capabilities.mjs'
      - 'tests/logistics206-invariants.mjs'
      - 'tests/worker214-bootstrap.mjs'
      - 'tests/command-bridge.mjs'
      - 'tests/extractor-haul.mjs'
      - 'tests/save-load-current.mjs'
      - 'tests/logistics-service-replan.mjs'
      - 'tests/transport-fire.mjs'
      - 'tests/ai-economy-logistics.mjs'
      - 'tests/multiplayer-probe.mjs'
      - 'tests/multiplayer-current-soak.mjs'
      - 'tests/build214-regression.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontline-current-publication
  cancel-in-progress: true

env:
  FD_EXPECTED_BUILD: '214'
  FD_BASE_URL: http://127.0.0.1:8765/frontline-dominion
  FD_GAME_URL: http://127.0.0.1:8765/frontline-dominion/frontline-dominion.html?build=214
  FD_MULTIPLAYER_URL: http://127.0.0.1:8765/frontline-dominion/multiplayer.html?build=214
  FD205_SOAK_MS: '90000'

jobs:
  release214:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical 214 from pinned source
        run: |
          set -euo pipefail
          python scripts/build.py --from-src
          python scripts/assemble214.py
          python scripts/hotfix214_ai_extraction_priority.py

      - name: Static build 214 gates
        run: |
          set -euo pipefail
          test -s dist/frontline-dominion.html
          test -s dist/transport-fire-v214.js
          test -s dist/ai-economy-logistics-v214.js
          test -s dist/friendly-extractor-visibility-v213.js
          test -s dist/runtime-shell-v214.js
          test -s dist/runtime-ui-v214.js
          test -s dist/save-slots-v214.js
          test -s dist/logistics-service-replan.js
          grep -q 'data-fd-canonical-build="214"' dist/frontline-dominion.html
          grep -q 'transport-fire-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'ai-economy-logistics-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'runtime-shell-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'save-slots-v214.js?build=214' dist/frontline-dominion.html
          grep -q 'logistics-service-replan.js?build=214' dist/frontline-dominion.html
          grep -q '__FD_BOOT_214__' dist/frontline-dominion.html
          grep -q 'transport-fire-v214.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'ai-economy-logistics-v214.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'logistics-service-replan.js?build=214' dist/authoritative-simulation-worker-v174.js
          grep -q 'groundPassengersFire: true' dist/transport-fire-v214.js
          grep -q 'aviationExcluded: true' dist/transport-fire-v214.js
          grep -q 'noDoubleFire: true' dist/transport-fire-v214.js
          grep -q '__FD_TRANSPORT_FIRE_214__' dist/transport-fire-v214.js
          grep -q 'extractionHauling:true' dist/ai-economy-logistics-v214.js
          grep -q 'storedReservePlanning:true' dist/ai-economy-logistics-v214.js
          grep -q '__FD_AI_ECONOMY_LOGISTICS_214__' dist/ai-economy-logistics-v214.js
          grep -q '__FD_AI_EXTRACTION_PRIORITY_214__' dist/ai-economy-logistics-v214.js
          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js
          grep -q 'serviceReplanOnUndeliverable:true' dist/logistics-service-replan.js
          grep -q 'friendlyExtractorFogPinning: true' dist/friendly-extractor-visibility-v213.js
          python -m py_compile scripts/build.py scripts/assemble214.py scripts/hotfix214_ai_extraction_priority.py
          node --check tests/runtime-capabilities.mjs
          node --check tests/worker214-bootstrap.mjs
          node --check tests/command-bridge.mjs
          node --check tests/extractor-haul.mjs
          node --check tests/save-load-current.mjs
          node --check tests/logistics-service-replan.mjs
          node --check tests/transport-fire.mjs
          node --check tests/ai-economy-logistics.mjs
          node --check tests/multiplayer-probe.mjs
          node --check tests/multiplayer-current-soak.mjs
          node --check tests/build214-regression.mjs
          for file in dist/*.js; do node --check "$file"; done

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve canonical build 214
        run: |
          set -euo pipefail
          rm -rf smoke-root
          mkdir -p smoke-root
          ln -s "$PWD/dist" smoke-root/frontline-dominion
          python -m http.server 8765 --directory smoke-root >/tmp/fd214-http.log 2>&1 &
          echo $! >/tmp/fd214-http.pid
          for attempt in $(seq 1 100); do
            if curl -fsSL "$FD_GAME_URL" >/tmp/fd214-local.html && curl -fsSL "$FD_MULTIPLAYER_URL" >/tmp/fd214-multiplayer.html; then exit 0; fi
            sleep .1
          done
          exit 1

      - name: Runtime and logistics regression gates
        run: |
          set -euo pipefail
          node tests/runtime-capabilities.mjs 2>&1 | tee /tmp/fd214-01-capabilities.log
          node tests/logistics206-invariants.mjs 2>&1 | tee /tmp/fd214-02-logistics-invariants.log
          node tests/worker214-bootstrap.mjs 2>&1 | tee /tmp/fd214-03-worker.log
          node tests/command-bridge.mjs 2>&1 | tee /tmp/fd214-04-command.log
          node tests/extractor-haul.mjs 2>&1 | tee /tmp/fd214-05-extractor.log
          node tests/save-load-current.mjs 2>&1 | tee /tmp/fd214-06-save-load.log
          node tests/logistics-service-replan.mjs 2>&1 | tee /tmp/fd214-07-service-replan.log

      - name: Build 214 feature gates
        run: |
          set -euo pipefail
          node tests/transport-fire.mjs 2>&1 | tee /tmp/fd214-08-transport-fire.log
          node tests/ai-economy-logistics.mjs 2>&1 | tee /tmp/fd214-09-ai-economy.log
          node tests/build214-regression.mjs 2>&1 | tee /tmp/fd214-10-canonical.log

      - name: Multiplayer deterministic checksum gate
        run: |
          set -euo pipefail
          node tests/multiplayer-probe.mjs 2>&1 | tee /tmp/fd214-11-multiplayer.log

      - name: Publish build 214 to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m 'Frontline Dominion v16.9.8 build 214 passenger fire and AI logistics'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify public build 214
        run: |
          set -euo pipefail
          PUBLIC_ROOT='https://drdkov.github.io/frontline-dominion'
          PUBLIC_GAME="$PUBLIC_ROOT/frontline-dominion.html?build=214&verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 90); do
            if curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_GAME" >/tmp/fd214-public.html && \
               grep -q 'data-fd-canonical-build="214"' /tmp/fd214-public.html && \
               grep -q 'transport-fire-v214.js?build=214' /tmp/fd214-public.html && \
               grep -q 'ai-economy-logistics-v214.js?build=214' /tmp/fd214-public.html; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_ROOT/transport-fire-v214.js?build=214&verify=${GITHUB_SHA}" >/tmp/fd214-public-transport.js
          curl --retry 2 --retry-all-errors -fsSL "$PUBLIC_ROOT/ai-economy-logistics-v214.js?build=214&verify=${GITHUB_SHA}" >/tmp/fd214-public-ai.js
          grep -q '__FD_TRANSPORT_FIRE_214__' /tmp/fd214-public-transport.js
          grep -q '__FD_AI_ECONOMY_LOGISTICS_214__' /tmp/fd214-public-ai.js
          FD_GAME_URL="$PUBLIC_GAME" node tests/worker214-bootstrap.mjs 2>&1 | tee /tmp/fd214-public-worker.log
          FD_GAME_URL="$PUBLIC_GAME" node tests/build214-regression.mjs 2>&1 | tee /tmp/fd214-public-regression.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd214-release-diagnostics
          path: |
            /tmp/fd214-*.log
            /tmp/fd214-*.html
            /tmp/fd214-*.js
          if-no-files-found: ignore
          retention-days: 3
