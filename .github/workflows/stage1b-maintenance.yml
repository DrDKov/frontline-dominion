name: Stage 1b maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage1b-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add PR 17 regression gates to release workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_once(text, anchor, addition, path):
              if addition in text:
                  return text
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {anchor!r}')
              return text.replace(anchor, anchor + '\n' + addition, 1)

          configs = {
              '.github/workflows/release213-v3.yml': [
                  ("      - 'tests/build213-regression-v2.mjs'", "      - 'tests/logistics211-service-replan.mjs'"),
                  ("          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js", "          grep -q 'serviceReplanOnUndeliverable:true' dist/supply-transport-v206.js"),
                  ("          node --check tests/screen-direction213.mjs", "          node --check tests/logistics211-service-replan.mjs"),
                  ("          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-missions.generated.mjs 2>&1 | tee /tmp/fd213-inherited-missions.log", "          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-service-replan.mjs 2>&1 | tee /tmp/fd213-service-replan.log"),
              ],
              '.github/workflows/release214.yml': [
                  ("      - 'tests/build213-regression-v2.mjs'", "      - 'tests/logistics211-service-replan.mjs'"),
                  ("          grep -q '__FD_TRUCK_DOCK_HOTFIX_213__' dist/supply-transport-v206.js", "          grep -q 'serviceReplanOnUndeliverable:true' dist/supply-transport-v206.js"),
                  ("          node --check tests/build213-regression-v2.mjs", "          node --check tests/logistics211-service-replan.mjs"),
                  ("          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-missions.generated.mjs 2>&1 | tee /tmp/fd214-inherited-missions.log", "          FD_GAME_URL=\"$GAME_URL\" node tests/logistics211-service-replan.mjs 2>&1 | tee /tmp/fd214-service-replan.log"),
              ],
          }

          for path, edits in configs.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for anchor, addition in edits:
                  text = insert_after_once(text, anchor, addition, path)
              p.write_text(text, encoding='utf-8')
              print(f'patched {path}')
          PY

          grep -q "tests/logistics211-service-replan.mjs" .github/workflows/release213-v3.yml
          grep -q "serviceReplanOnUndeliverable:true" .github/workflows/release213-v3.yml
          grep -q "tests/logistics211-service-replan.mjs" .github/workflows/release214.yml
          grep -q "serviceReplanOnUndeliverable:true" .github/workflows/release214.yml

      - name: Commit workflow coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release213-v3.yml .github/workflows/release214.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: add SERVICE replan regression gates to releases'
            git push origin HEAD:main
          fi

      - name: Delete stale build211 service-replan branches
        run: |
          set -euo pipefail
          for branch in build211-service-replan build211-service-replan-v2 build211-service-replan-v3; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done

      - name: Dispatch vendor-src-legacy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh run list --workflow vendor-src-legacy.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run vendor-src-legacy.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            current="$(gh run list --workflow vendor-src-legacy.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$current" != "0" ] && [ "$current" != "$before" ]; then
              run_id="$current"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "vendor run id: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify vendored snapshot on main
        run: |
          set -euo pipefail
          git fetch origin main
          pinned_count="$(git ls-tree -r --name-only origin/main src/legacy | grep -v '^src/legacy/PROVENANCE.md$' | wc -l | tr -d ' ')"
          test "$pinned_count" = '836'
          git show origin/main:src/legacy/PROVENANCE.md | tee /tmp/src-legacy-provenance.md
          git reset --hard origin/main
          python scripts/build.py --from-src
          test -s dist/frontline-dominion.html
          echo "Stage 1b verified: 836 pinned files + provenance; offline build succeeded."
